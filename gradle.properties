org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# compileSdk/targetSdk 36 (Play talabi). AGP 8.9.1 API 36 ni rasman qo'llaydi (Gradle >= 8.11.1 kerak: gradle/wrapper).
# Quyidagi qator zararsiz: AGP kelajakda yangi compileSdk haqida ogohlantirsa, build to'xtamaydi.
android.suppressUnsupportedCompileSdk=36
# Tarjima serveri manzili (backend/worker.js ni joylagach yozing):
# ozkeyTranslateUrl=https://ozkey-translate.XXXX.workers.dev
# Qo'shimcha tillar ro'yxati (ixtiyoriy):
# ozkeyPacksUrl=https://example.com/ozkey/packs/index.json

# Ixtiyoriy: do'kon va qo'llab-quvvatlash havolalari (bo'sh bo'lsa tugmalar ko'rinmaydi)
ozkeyStoreUrl=
ozkeySupportUrl=
