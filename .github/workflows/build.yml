name: Build APK + AAB

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Gradle Wrapper validation
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Wrapper permission
        run: chmod +x ./gradlew

      - name: JVM unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Kotlin compilation diagnostics
        run: |
          set +e
          ./gradlew :app:compileDebugKotlin --stacktrace 2>&1 | tee kotlin-error.log
          code=${PIPESTATUS[0]}
          echo ""
          echo "===== KOTLIN ERRORS ====="
          grep -nE "e: |error:|ERROR|Compilation error" kotlin-error.log || true
          echo "===== END KOTLIN ERRORS ====="
          exit $code

      - name: Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Detect release signing secrets
        id: signing
        env:
          KS_B64: ${{ secrets.OZKEY_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.OZKEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OZKEY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OZKEY_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore release keystore
        if: steps.signing.outputs.has_keystore == 'true'
        env:
          KS_B64: ${{ secrets.OZKEY_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/ozkey.jks"

      - name: Release APK + AAB
        if: steps.signing.outputs.has_keystore == 'true'
        env:
          OZKEY_KEYSTORE: ${{ runner.temp }}/ozkey.jks
          OZKEY_STORE_PASSWORD: ${{ secrets.OZKEY_STORE_PASSWORD }}
          OZKEY_KEY_ALIAS: ${{ secrets.OZKEY_KEY_ALIAS }}
          OZKEY_KEY_PASSWORD: ${{ secrets.OZKEY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Release key missing
        if: steps.signing.outputs.has_keystore != 'true'
        run: |
          echo "::notice::Release APK/AAB yig'ilmadi - GitHub Secrets orqali 4 ta signing qiymati berilmagan."

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ozkey.jks"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OZKEY-build
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OZKEY-test-reports
          if-no-files-found: ignore
          path: app/build/reports/tests/
