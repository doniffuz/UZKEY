name: Build APK + AAB
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Sirlar mavjud bo'lsa 'true' (secrets to'g'ridan-to'g'ri if: ichida ishlamaydi, shuning uchun env orqali)
      HAS_KS: ${{ secrets.OZKEY_KEYSTORE_B64 != '' && secrets.OZKEY_STORE_PASSWORD != '' && secrets.OZKEY_KEY_ALIAS != '' && secrets.OZKEY_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Gradle Wrapper jar tekshiruvi (rasmiy checksum bilan)
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses (compileSdk 36 yo'q bo'lsa Gradle o'zi yuklaydi)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Wrapper ruxsati
        run: chmod +x ./gradlew
      - name: JVM unit testlar
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Keystore'ni tiklash (faqat sirlar bor bo'lsa)
        if: env.HAS_KS == 'true'
        env:
          KS_B64: ${{ secrets.OZKEY_KEYSTORE_B64 }}
        run: printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/ozkey.jks"
      - name: Release APK + AAB (Uptodown / Play Market)
        if: env.HAS_KS == 'true'
        env:
          OZKEY_KEYSTORE: ${{ runner.temp }}/ozkey.jks
          OZKEY_STORE_PASSWORD: ${{ secrets.OZKEY_STORE_PASSWORD }}
          OZKEY_KEY_ALIAS: ${{ secrets.OZKEY_KEY_ALIAS }}
          OZKEY_KEY_PASSWORD: ${{ secrets.OZKEY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace
      - name: Release kaliti yo'q (faqat debug APK yig'ildi)
        if: env.HAS_KS != 'true'
        run: echo "::notice::Release APK/AAB yig'ilmadi - 4 ta GitHub siri yo'q. tools/make-keystore.sh ga qarang."
      - name: Keystore'ni o'chirish
        if: always()
        run: rm -f "$RUNNER_TEMP/ozkey.jks"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OZKEY-build
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: OZKEY-test-reports
          if-no-files-found: ignore
          path: app/build/reports/tests/
